<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lastro · Portal</title>
<meta name="description" content="Portal do Lastro: demandas de análise, perguntas antes de calcular, auditoria e revisão do seu time antes da entrega.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/site/marca/simbolo-cotejo-claro.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/site/marca/favicon-32.png">
<link rel="preload" as="font" type="font/woff2" href="/site/fontes/ibm-plex-sans-latin-400-normal.woff2" crossorigin>
<link rel="stylesheet" href="/web/marca.css">
<style>
* { box-sizing: border-box }
body { margin: 0; background: var(--chao); color: var(--tinta); font: 15px/1.55 var(--f-texto) }
button, input, textarea, select { font: inherit; color: inherit }
.logo { display: inline-flex; align-items: center; gap: 10px; font: 700 20px var(--f-disp); letter-spacing: -.01em }
.logo i { display: grid; gap: 2px; width: 18px } .logo i b { height: 4px; border-radius: 1px; display: block }
.logo i b:nth-child(1) { background: var(--ouro) } .logo i b:nth-child(2) { background: var(--prata) } .logo i b:nth-child(3) { background: var(--bronze) }
header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--linha); background: var(--sup) }
.quem { color: var(--quieta); font-size: 13px } .quem b { color: var(--tinta); font-weight: 600 }
.grade { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 60px) }
aside { border-right: 1px solid var(--linha); padding: 16px; display: flex; flex-direction: column; gap: 8px; background: var(--sup-2) }
main { padding: 24px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px)); min-width: 0; max-width: 980px }
h1 { font: 700 28px/1.15 var(--f-disp); margin: 0 0 6px; text-wrap: balance } h2 { font: 600 17px var(--f-disp); margin: 28px 0 10px }
.rot { font: 500 11px var(--f-dado); text-transform: uppercase; letter-spacing: .08em; color: var(--quieta) }
.item { text-align: left; border: 1px solid transparent; background: none; padding: 10px 12px; border-radius: 8px; cursor: pointer; display: grid; gap: 4px }
.item:hover { background: var(--sup) } .item.ativo { background: var(--sup); border-color: var(--linha) }
.item span:first-child { font-size: 14px; line-height: 1.35 }
.status { font: 500 11px var(--f-dado); padding: 2px 8px; border-radius: 99px; justify-self: start; background: var(--linha); color: var(--tinta) }
.status.grill { background: var(--ouro-f); color: var(--ouro-tx) } .status.em_revisao { background: var(--ouro-f); color: var(--ouro-tx) }
.status.aprovada { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok) } .status.reprovada { background: color-mix(in srgb, var(--erro) 18%, transparent); color: var(--erro) }
.bloco { background: var(--sup); border: 1px solid var(--linha); border-radius: 10px; padding: 18px; display: grid; gap: 14px; min-width: 0 }
label { display: grid; gap: 6px; font-weight: 500 } label small { color: var(--quieta); font-weight: 400 }
input[type=text], input[type=email], input[type=password], input[type=number], input[type=url], textarea { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--campo); border-radius: 8px; background: var(--sup-2) }
textarea { min-height: 84px; resize: vertical }
:focus-visible { outline: 2px solid var(--ouro); outline-offset: 2px }
.btn { border: 0; border-radius: 8px; min-height: 44px; padding: 10px 16px; font-weight: 600; cursor: pointer; background: var(--tinta); color: var(--chao) }
.btn.sec { background: transparent; color: var(--tinta); border: 1px solid var(--campo) } .btn.ouro { background: var(--ouro); color: var(--sobre-ouro) }
.btn:disabled { opacity: .5; cursor: progress }
.linha-btn { display: flex; gap: 8px; flex-wrap: wrap }
.fontes { display: flex; gap: 8px; flex-wrap: wrap } .fontes label { display: flex; align-items: center; gap: 6px; font: 400 14px var(--f-dado); border: 1px solid var(--linha); padding: 6px 10px; border-radius: 8px }
.tabela { overflow-x: auto } table { border-collapse: collapse; width: 100%; font-size: 14px }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--linha); white-space: nowrap } th { color: var(--quieta); font-weight: 600 }
td.n { text-align: right; font: 14px var(--f-dado); font-variant-numeric: tabular-nums }
.barra { height: 8px; background: var(--ouro); border-radius: 2px; min-width: 2px }
.ok { color: var(--ok) } .erro { color: var(--erro) } .aviso { color: var(--aviso) }
.chk td:first-child { font: 600 12px var(--f-dado) }
.total { font: 700 34px var(--f-disp); font-variant-numeric: tabular-nums }
.rastro { display: grid; gap: 0; font-size: 13px } .rastro div { display: grid; grid-template-columns: 110px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--linha) }
.rastro b { font: 500 12px var(--f-dado); color: var(--ouro-tx) } .rastro span { color: var(--quieta); overflow-wrap: anywhere }
code, pre { font: 13px var(--f-dado) } pre { white-space: pre-wrap; margin: 0; background: var(--sup-2); padding: 12px; border-radius: 8px; overflow-x: auto }
.erro-msg { color: var(--erro); font-size: 14px }
.login { min-height: 100vh; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)) }
.login .bloco { width: min(420px, 100%) }
.dica { font: 13px var(--f-dado); color: var(--quieta); background: var(--sup-2); padding: 10px 12px; border-radius: 8px }
.grill-q { display: grid; gap: 6px; padding-bottom: 14px; border-bottom: 1px solid var(--linha) } .grill-q:last-of-type { border-bottom: 0 }
.abas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--chao); padding: 4px; border-radius: 9px; margin-bottom: 8px }
.aba { border: 0; background: none; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: 600; color: var(--quieta) } .aba.ativa { background: var(--sup); color: var(--tinta) }
#lado { display: flex; flex-direction: column; gap: 8px }
.passos { list-style: none; counter-reset: p; padding: 0; margin: 14px 0 0; display: flex; flex-wrap: wrap; gap: 6px }
.passos li { counter-increment: p; font: 12px var(--f-dado); border: 1px solid var(--linha); border-radius: 99px; padding: 4px 10px; color: var(--quieta) }
.passos li::before { content: counter(p) " · "; color: var(--ouro-tx) } .passos li.feito { background: var(--sup) }
.duas-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px }
select { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--campo); border-radius: 8px; background: var(--sup-2) }
.modo { border: 1px solid var(--linha); border-radius: 8px; padding: 10px 14px; display: grid; gap: 8px } .modo label { display: block; font-weight: 500 } .modo small { display: block; color: var(--quieta); font-weight: 400; margin-left: 22px }
.numeros { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px } .numeros div { display: grid; gap: 2px } .numeros b { font: 700 22px var(--f-disp); font-variant-numeric: tabular-nums }
th { white-space: nowrap }
.contrato td { white-space: normal; overflow-wrap: anywhere }
@media (max-width: 760px) { .grade { grid-template-columns: 1fr } aside { border-right: 0; border-bottom: 1px solid var(--linha) } }
@media (max-width: 480px) { header .quem .papel { display: none } header .linha-btn { flex-wrap: nowrap } header .quem { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 } }
.ancoras { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 16px } .ancoras a { font: 12px var(--f-dado); color: var(--quieta); text-decoration: none; border: 1px solid var(--linha); border-radius: 99px; padding: 6px 12px; min-height: 32px } .ancoras a:hover { color: var(--tinta); border-color: var(--campo) }
.selo-aud { margin: 4px 0 0 }
details.dobra { margin-top: 8px } details.dobra > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; min-height: 44px }
details.dobra > summary::-webkit-details-marker { display: none } details.dobra > summary::before { content: "+"; font: 500 18px var(--f-dado); color: var(--quieta); width: 14px }
details.dobra[open] > summary::before { content: "−" } details.dobra > summary h2 { margin: 18px 0 10px }
[id^="sec-"], details.dobra { scroll-margin-top: 16px }
.esqueleto { background: linear-gradient(90deg, var(--sup) 0, var(--sup-2) 50%, var(--sup) 100%); background-size: 200% 100% }
@media (prefers-reduced-motion: no-preference) { .esqueleto { animation: brilho 1.2s linear infinite } @keyframes brilho { to { background-position: -200% 0 } } }
@media (prefers-reduced-motion: no-preference) { .bloco { animation: sobe .25s ease-out } @keyframes sobe { from { transform: translateY(4px) } to { transform: none } } }
</style>
</head>
<body>
<div id="app"></div>
<script src="/web/app.js"></script>
</body>
</html>
