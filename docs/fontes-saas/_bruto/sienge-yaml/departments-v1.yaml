swagger: '2.0'
info:
  description: API de departamentos.
  version: 1.0.0
  title: Departamentos
host: api.sienge.com.br
basePath: '/{subdominio-do-cliente}/public/api/v1'
tags:
  - name: Departments
    description: API para listagem de departamentos
schemes:
  - https
securityDefinitions:
  basicAuth:
    type: basic
    description: HTTP Basic Authentication. Works over `HTTP` and `HTTPS`
security:
  - basicAuth: []
paths:
  '/departments/{departmentId}':
    get:
      tags:
        - departments
      summary: Busca o departamento no Sienge
      operationId: getDepartmentsID
      parameters:
        - name: departmentId
          in: path
          description: Código do departamento a ser apresentado
          required: true
          type: integer
          format: int32
      produces:
        - application/json
      responses:
        '200':
          description: Departamento encontrado
          schema:
            $ref: '#/definitions/DetailedDepartment'
        '400':
          description: Requisição mal formada
          schema:
            $ref: '#/definitions/ResponseMessage'
        '404':
          description: Departamento não encontrado
          schema:
            $ref: '#/definitions/ResponseMessage'
        '500':
          description: Erro interno no servidor
          schema:
            $ref: '#/definitions/ResponseMessage'
  /departments:
    get:
      tags:
        - departments
      summary: Busca uma lista de departamentos
      operationId: getDepartments
      parameters:
        - name: limit
          in: query
          description: >-
            Quantidade máxima de resultados da pesquisa a serem retornados.
            Valor default é 100 e o valor máximo permitdo é 200.
          required: false
          type: integer
          default: 100
          maximum: 200
          minimum: 1
          format: int32
        - name: offset
          in: query
          description: >-
            Deslocamento entre o começo da lista e um dado elemento. Valor
            default 0.
          required: false
          type: integer
          default: 0
          format: int32
        - name: name
          in: query
          description: Nome do departamento para filtro da pesquisa.
          required: false
          type: string
        - name: directorateId
          in: query
          description: Código da diretoria para filtro da pesquisa.
          required: false
          type: integer
          format: int32
        - name: directorateName
          in: query
          description: Nome da diretoria para filtro da pesquisa.
          required: false
          type: string
        - name: active
          in: query
          description: Filtra departamentos ativos ou inativos.
          required: false
          type: boolean
        - name: purchaseRequestAttachmentRequired
          in: query
          description: Filtra departamentos que exigem anexo na solicitação de compra.
          required: false
          type: boolean
      produces:
        - application/json
      responses:
        '200':
          description: Departamento encontrado
          schema:
            $ref: '#/definitions/GetResponseDocument'
        '400':
          description: Requisição mal formada
          schema:
            $ref: '#/definitions/ResponseMessage'
        '404':
          description: Departamento não encontrado
          schema:
            $ref: '#/definitions/ResponseMessage'
        '500':
          description: Erro interno no servidor
          schema:
            $ref: '#/definitions/ResponseMessage'
    post:
      tags:
        - departments
      summary: Cria um departamento no Sienge
      operationId: createDepartments
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - name: body
          in: body
          description: Objeto para criação do departamento
          required: true
          schema:
            $ref: '#/definitions/CreateDepartmentRequest'
      responses:
        '201':
          description: Departamento criado com sucesso
          schema:
            $ref: '#/definitions/CreateDepartmentResponse'
        '400':
          description: Requisição mal formada
          schema:
            $ref: '#/definitions/ResponseMessage'
        '404':
          description: Departamento não encontrado
          schema:
            $ref: '#/definitions/ResponseMessage'
        '500':
          description: Erro interno no servidor
          schema:
            $ref: '#/definitions/ResponseMessage'
      x-audience: []
definitions:

  ResultSetMetadata:
    type: object
    required:
      - count
      - limit
      - offset
    properties:
      count:
        type: integer
        format: int64
        description: >-
          Total de resultados disponíveis na base de dados como resultado da
          pesquisa efetuada
      offset:
        type: integer
        format: int32
        description: >-
          Deslocamento entre o começo da lista e um dado elemento. Valor default
          Ã© 0.
      limit:
        type: integer
        format: int32
        description: >-
          Quantidade máxima de resultados da pesquisa a serem retornados. Valor
          default é 100 e o valor máximo permitdo é 200.
        minimum: 1
        maximum: 200
  
  GetResponseDocument:
    type: object
    required:
      - links
      - resultSetMetadata
      - results
    properties:
      resultSetMetadata:
        $ref: '#/definitions/ResultSetMetadata'
      results:
        type: array
        description: Lista de Departamentos
        items:
          $ref: '#/definitions/DetailedDepartment'

  Directorate:
    type: object
    properties:
      directorateId:
        type: integer
        format: int32
        description: Código da diretoria.
        example: 1
      name:
        type: string
        description: Nome da diretoria.
        example: Diretoria 1

  DetailedDepartment:
    type: object
    properties:
      departmentId:
        type: integer
        format: int32
        description: Código do departamento.
        example: 1
      departmentName:
        type: string
        description: Nome do departamento.
        example: Departamento 1
      directorate:
        $ref: '#/definitions/Directorate'
      active:
        type: boolean
        description: Indica se o departamento está ativo.
        example: true
      managerName:
        type: string
        description: Nome do gestor do departamento.
        example: João da Silva
      purchaseRequestAttachmentRequired:
        type: boolean
        description: Indica se é obrigatório anexo na solicitação de compra.
        example: false

  CreateDepartmentRequest:
    type: object
    required:
      - name
      - directorateId
      - managerName
    properties:
      name:
        type: string
        maxLength: 80
        description: Nome do departamento.
        example: Departamento Financeiro
      directorateId:
        type: integer
        format: int32
        description: Código da diretoria.
        example: 1
      managerName:
        type: string
        maxLength: 80
        description: Nome do gestor do departamento.
        example: João da Silva
      purchaseRequestAttachmentRequired:
        type: boolean
        description: Indica se é obrigatório anexo na solicitação de compra.
        example: false

  CreateDepartmentResponse:
    type: object
    properties:
      departmentId:
        type: integer
        format: int32
        description: Código do departamento.
        example: 1

  ResponseMessage:
    type: object
    properties:
      status:
        type: integer
        description: Status Http
      developerMessage:
        type: string
        description: Mensagem de resposta para analise do desenvolvedor
        example: Developer description message
      clientMessage:
        type: string
        description: Mensagem de resposta para o usuário
        example: Client description message.