<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sienge Platform</title>
    <link
      href="https://fonts.googleapis.com/css?family=Open+Sans:400,700|Source+Code+Pro:300,600|Titillium+Web:400,600,700"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="./../swagger-files/swagger-ui.css"
    />
    <style>
      html {
        box-sizing: border-box;
        overflow: -moz-scrollbars-vertical;
        overflow-y: scroll;
      }

      *,
      *:before,
      *:after {
        box-sizing: inherit;
      }

      body {
        margin: 0;
      }
    </style>
  </head>

  <body>
    <div id="swagger-ui"></div>

    <script src="./../swagger-files/swagger-ui-bundle.js"></script>
    <script src="./../swagger-files/swagger-ui-standalone-preset.js"></script>
    <script>
      window.onload = function () {
        // Build a system
        window.ui = SwaggerUIBundle({
          url: "https://api.sienge.com.br/docs/yaml-files/payment-categories-v1.yaml?timestamp=1795568863",
          dom_id: "#swagger-ui",
          deepLinking: true,
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          plugins: [SwaggerUIBundle.plugins.DownloadUrl],
          layout: "StandaloneLayout",
        });
      };
    </script>
  </body>
</html>
