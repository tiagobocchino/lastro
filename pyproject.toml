[project]
name = "lastro"
version = "0.1.0"
description = "Lastro: agentes de análise de dados com auditoria em duas camadas, multi-empresa e somente leitura nas fontes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "duckdb>=1.1",
  "pyyaml>=6",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lastro = "lastro.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lastro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
